<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Студийный таймер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a0c;--s1:#131316;--s2:#1c1c21;--line:rgba(255,255,255,.07);--tx:#f3f3f5;--mut:#8a8a94;--dim:#4d4d56;--acc:#c8f04a;--acc-tx:#0a0a0c;--red:#ff5d5d;--amb:#ffb648;--mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace}
html{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;position:fixed;inset:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:absolute;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px}
h2{margin:22px 0 10px;font-size:26px;font-weight:700;letter-spacing:-.02em}
h3{margin:0 0 10px;font-size:15px;font-weight:600}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.center{text-align:center}
.hint{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0}
.line+.line{border-top:1px solid var(--line)}
.line>span:last-child{white-space:nowrap}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--s2);color:var(--tx);font:inherit;margin:4px 0 8px}
input:focus,textarea:focus{outline:none;border-color:rgba(200,240,74,.5)}
input::placeholder{color:var(--dim)}
textarea{font:12px/1.5 var(--mono);min-height:260px;color:var(--mut)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--acc);color:var(--acc-tx);font:inherit;font-weight:600;margin:4px 0}
.btn:active,.item:active,.go:active{transform:scale(.98)}
.btn.alt{background:var(--s2);color:var(--tx)}
.btn.ok{background:var(--acc);color:var(--acc-tx)}
.btn.warn{background:transparent;color:var(--amb);border:1px solid rgba(255,182,72,.4)}
.btn.del,.btn.end{background:transparent;color:var(--red);border:1px solid rgba(255,93,93,.3)}
.btn.sm{width:auto;padding:12px 16px;margin:4px 0 8px}
.two{display:flex;gap:8px}.two .btn{flex:1}
.inl{display:flex;gap:8px;align-items:center}
.inl input{flex:1}
.go{display:grid;place-items:center;margin:48px auto 18px;width:210px;height:210px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-tx);font:inherit;font-size:24px;font-weight:700;box-shadow:0 0 0 14px rgba(200,240,74,.07),0 0 0 30px rgba(200,240,74,.035),0 24px 70px rgba(200,240,74,.18)}
.clock{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.ringwrap{position:relative;width:256px;height:256px;margin:22px auto 8px}
.ringwrap svg{display:block}
.ringwrap .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:none}
.dot.live{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:var(--s2);color:var(--tx);font:inherit;padding:13px 14px;border-radius:14px;margin:6px 0}
.pcard{display:block;width:100%;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--s2);color:var(--mut);font-weight:500;vertical-align:middle}
.badge.done{background:rgba(200,240,74,.12);color:var(--acc)}
.big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.grid .card{margin:0}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin:16px 0 10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;padding:8px;border-radius:10px}
.seg button.on{background:var(--s2);color:var(--tx)}
.per{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.per b{font-weight:600;text-transform:capitalize}
.per button{border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;font-size:18px;width:42px;height:38px;border-radius:12px}
.task{padding:12px 0}
.task+.task{border-top:1px solid var(--line)}
.task.d .tn{text-decoration:line-through;color:var(--mut)}
.ib{border:0;background:var(--s2);color:var(--tx);font:inherit;border-radius:10px;padding:7px 11px;margin-left:4px}
.ib.play{background:var(--acc);color:var(--acc-tx)}
.pen{border:0;background:none;color:var(--dim);font-size:14px;padding:2px 6px}
details summary{color:var(--mut);font-size:13px;cursor:pointer;margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+ '}
details[open] summary::before{content:'− '}
details.sw{margin:4px 0 8px}
details.sw summary{text-align:center;padding:8px}
.x{border:0;background:none;color:var(--dim);font-size:16px;padding:4px 8px}
a.back{color:var(--mut);text-decoration:none;display:inline-block;margin-top:16px;font-size:14px}
.top{color:var(--acc)}.low{color:var(--red)}
.hbar{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:8px}
.hbar i{display:block;height:100%;border-radius:3px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:12px 0 10px;background:var(--s2)}
.tl{position:relative;height:12px;background:var(--s2);border-radius:4px;overflow:hidden;margin:12px 0 6px}
.tl i{position:absolute;top:0;bottom:0}
.cols{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:14px}
.cols .c{flex:1;position:relative;height:100%}
.cols .c b,.cols .c i{position:absolute;bottom:0;left:0;right:0;border-radius:3px 3px 1px 1px}
.cols .c b{background:var(--s2)}
.cols .c i{background:var(--acc)}
.axis{display:flex;gap:3px;margin-top:6px}
.axis span{flex:1;text-align:center;font-size:10px;color:var(--dim);font-family:var(--mono);overflow:visible;white-space:nowrap}
.leg{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));align-items:flex-start;display:flex;background:rgba(10,10,12,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.04em;padding:4px 0}
nav svg{display:block;margin:0 auto 4px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
</style>
</head>
<body>
<div id="app"><p class="hint" style="margin-top:30px">Загрузка…</p></div>
<nav>
  <button id="n-home" onclick="tab='home';cur=null;ren=null;render()"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg>Работа</button>
  <button id="n-proj" onclick="tab='proj';cur=null;ren=null;render()"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>Проекты</button>
  <button id="n-stat" onclick="tab='stat';cur=null;ren=null;render()"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>Статистика</button>
</nav>
<script>
const tg = window.Telegram && Telegram.WebApp;
const V = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
if (tg) { tg.ready(); tg.expand(); try { if (V('7.7')) tg.disableVerticalSwipes(); } catch {} }
const cloud = !!(tg && tg.initData && tg.CloudStorage && V('6.9'));
const LS = 'st-';

/* ===== Хранилище: Telegram CloudStorage (синхронизируется между устройствами) или localStorage в обычном браузере ===== */
const store = {
  async keys() {
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.getKeys((e, k) => e ? no(e) : ok(k || [])));
    return Object.keys(localStorage).filter(k => k.startsWith(LS)).map(k => k.slice(LS.length));
  },
  async get(keys) {
    const out = {};
    for (let i = 0; i < keys.length; i += 40) {
      const part = keys.slice(i, i + 40);
      if (cloud) await new Promise((ok, no) => tg.CloudStorage.getItems(part, (e, v) => e ? no(e) : (Object.assign(out, v || {}), ok())));
      else part.forEach(k => { const v = localStorage.getItem(LS + k); if (v != null) out[k] = v; });
    }
    return out;
  },
  async set(k, v) {
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.setItem(k, v, e => e ? no(e) : ok()));
    localStorage.setItem(LS + k, v);
  },
  async del(keys) {
    if (!keys.length) return;
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.removeItems(keys, e => e ? no(e) : ok()));
    keys.forEach(k => localStorage.removeItem(LS + k));
  }
};

/* ===== Утилиты ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Math.floor(Date.now() / 1000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fd = s => { s = Math.max(0, s); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(n => String(n).padStart(2, '0')).join(':'); };
const fh = s => { const m = Math.round(s / 60); return Math.floor(m / 60) + ' ч ' + String(m % 60).padStart(2, '0') + ' м'; };
const hd = s => (s / 3600).toFixed(1).replace('.', ',');
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
const money = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fdate = t => new Date(t * 1000).toLocaleDateString('ru-RU');
const fday = t => new Date(t * 1000).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
const ftime = t => new Date(t * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const ymOf = t => { const d = new Date(t * 1000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const dayStart = t => { const d = new Date(t * 1000); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; };
const toast = m => V('6.2') ? tg.showAlert(m) : alert(m);
const ask = m => new Promise(r => V('6.2') ? tg.showConfirm(m, r) : r(confirm(m)));
const buzz = () => { try { if (V('6.1')) tg.HapticFeedback.impactOccurred('medium'); } catch {} };
const num = v => parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));

/* ===== Данные =====
   P — проекты {id, n, pr: стоимость, c: закрыт (время) или 0, cr: создан, h: [[время, сумма, комментарий]] доплаты}
   T — задачи {id, p: проект, n, d: готова (время) или 0}
   E — отрезки работы над задачей {id, t: задача, a, b, w: id рабочей сессии или null (если добавлено вручную)}
   W — завершённые рабочие сессии {id, a, b}
   S — текущая рабочая сессия {w: {id, a}, t: активная задача или null, r: начало текущего отрезка или null (пауза)} */
let P = [], T = [], E = [], W = [], S = null;
const cache = {};
let tab = 'home', cur = null, ren = null, sMode = 'month', sOff = 0, report = null, ended = null;

async function load() {
  const keys = (await store.keys()).filter(k => /^(S$|B$|P-|T-|e-|w-)/.test(k));
  const v = await store.get(keys);
  for (const k of keys) {
    const s = v[k]; if (!s) continue;
    let d; try { d = JSON.parse(s); } catch { continue; }
    if (k === 'S') { S = d; continue; }
    if (k === 'B') { lastBk = +d || 0; continue; }
    cache[k] = s;
    if (k.startsWith('P-')) d.forEach(r => P.push({ id: r[0], n: r[1], pr: r[2], c: r[3], cr: r[4], h: r[5] || [] }));
    else if (k.startsWith('T-')) d.forEach(r => T.push({ id: r[0], p: r[1], n: r[2], d: r[3] }));
    else if (k.startsWith('w-')) d.forEach(r => W.push({ id: r[0], a: r[1], b: r[2] }));
    else d.forEach(r => E.push({ id: r[0], t: r[1], a: r[2], b: r[3], w: r[4] || null }));
  }
  if (S && !S.w) S = { w: { id: uid(), a: S.a || now() }, t: S.t || null, r: S.r || null }; // старый формат
  P.sort((x, y) => x.cr - y.cr);
  T.sort((x, y) => x.id < y.id ? -1 : 1);
}

// Запись коллекции кусками до ~3500 символов (лимит Telegram — 4096 на ключ); неизменённые куски не перезаписываются
async function saveChunks(prefix, rows) {
  const chunks = []; let c = [];
  for (const r of rows) { c.push(r); if (JSON.stringify(c).length > 3500 && c.length > 1) { c.pop(); chunks.push(c); c = [r]; } }
  if (c.length) chunks.push(c);
  const want = new Set();
  for (let i = 0; i < chunks.length; i++) {
    const k = prefix + i, s = JSON.stringify(chunks[i]); want.add(k);
    if (cache[k] !== s) { await store.set(k, s); cache[k] = s; }
  }
  const stale = Object.keys(cache).filter(k => k.startsWith(prefix) && /^\d+$/.test(k.slice(prefix.length)) && !want.has(k));
  if (stale.length) { await store.del(stale); stale.forEach(k => delete cache[k]); }
}
let queue = Promise.resolve();
const persist = fn => { queue = queue.then(fn).catch(e => toast('Ошибка сохранения: ' + ((e && e.message) || e))); };
const saveP = () => persist(() => saveChunks('P-', P.map(p => [p.id, p.n, p.pr, p.c, p.cr, p.h])));
const saveT = () => persist(() => saveChunks('T-', T.map(t => [t.id, t.p, t.n, t.d])));
const saveM = ym => persist(() => saveChunks('e-' + ym + '-', E.filter(e => ymOf(e.a) === ym).sort((x, y) => x.a - y.a).map(e => [e.id, e.t, e.a, e.b, e.w])));
const saveW = ym => persist(() => saveChunks('w-' + ym + '-', W.filter(w => ymOf(w.a) === ym).sort((x, y) => x.a - y.a).map(w => [w.id, w.a, w.b])));
const saveS = () => persist(() => S ? store.set('S', JSON.stringify(S)) : store.del(['S']));

/* ===== Расчёты ===== */
const task = id => T.find(t => t.id === id);
const proj = id => P.find(p => p.id === id);
const tname = id => (task(id) || { n: '?' }).n;
const pname = tid => (proj((task(tid) || {}).p) || { n: '?' }).n;
const pidOf = e => (task(e.t) || {}).p;
const allE = () => S && S.t && S.r ? E.concat([{ t: S.t, a: S.r, b: now(), w: S.w.id }]) : E;
const allW = () => S ? W.concat([{ id: S.w.id, a: S.w.a, b: now(), open: true }]) : W;
const sum = es => es.reduce((x, e) => x + e.b - e.a, 0);
const taskSec = id => sum(allE().filter(e => e.t === id));
const projSec = pid => { const ids = new Set(T.filter(t => t.p === pid).map(t => t.id)); return sum(allE().filter(e => ids.has(e.t))); };
const shiftEs = wid => allE().filter(e => e.w === wid);
const rate = p => { const s = projSec(p.id); return s > 0 ? p.pr / (s / 3600) : 0; };
const base = p => p.pr - p.h.reduce((x, h) => x + h[1], 0);

/* ===== Рабочая сессия и задачи ===== */
function addEntry(t, a, b, w) { if (b - a < 5) return; E.push({ id: uid(), t, a, b, w }); saveM(ymOf(a)); }
function closeInterval() { if (S && S.t && S.r) { addEntry(S.t, S.r, now(), S.w.id); S.r = null; } }
function startShift() { S = { w: { id: uid(), a: now() }, t: null, r: null }; ended = null; buzz(); saveS(); render(); }
function go(tid) {
  if (!S) S = { w: { id: uid(), a: now() }, t: null, r: null };
  closeInterval(); S.t = tid; S.r = now(); ended = null;
  tab = 'home'; cur = null; buzz(); saveS(); render();
}
function pauseTask() { closeInterval(); saveS(); render(); }
function resumeTask() { if (S && S.t && !S.r) { S.r = now(); buzz(); saveS(); render(); } }
function releaseTask() { closeInterval(); if (S) S.t = null; saveS(); render(); }
async function doneTask() {
  if (!S || !S.t) return; const t = task(S.t);
  closeInterval(); S.t = null; if (t) { t.d = now(); saveT(); } saveS(); render();
  if (t) { const p = proj(t.p); if (p && !p.c && !T.some(x => x.p === p.id && !x.d) && await ask('Все задачи проекта «' + p.n + '» готовы. Закрыть проект?')) closeProject(p.id); }
}
async function endShift() {
  if (!S) return;
  if (!(await ask('Завершить рабочую сессию?'))) return;
  closeInterval();
  const w = { id: S.w.id, a: S.w.a, b: now() };
  W.push(w); saveW(ymOf(w.a)); S = null; saveS(); ended = w.id; render();
}
function releaseIfIn(pred) { if (S && S.t && pred(S.t)) { closeInterval(); S.t = null; saveS(); } }

/* ===== Проекты, задачи, переименование ===== */
function newProject() {
  const n = $('#np-n').value.trim(), pr = num($('#np-p').value);
  if (!n) return toast('Впиши название проекта');
  if (!(pr >= 0)) return toast('Впиши стоимость проекта (можно 0 и поправить потом)');
  P.push({ id: uid(), n, pr, c: 0, cr: now(), h: [] }); saveP(); render();
}
function newTask(pid, andGo) {
  const el = $('#nt-' + pid), n = el.value.trim();
  if (!n) return el.focus();
  const t = { id: uid(), p: pid, n, d: 0 }; T.push(t); saveT();
  if (andGo) go(t.id); else render();
}
function startRen(k) { ren = k; render(); }
function doRename(val) {
  if (!ren) return;
  const [kind, id] = ren.split(':'), n = String(val).trim(), o = kind === 'p' ? proj(id) : task(id);
  ren = null;
  if (o && n && n !== o.n) { o.n = n; kind === 'p' ? saveP() : saveT(); }
  render();
}
const renInput = (val, max) => `<input id="ren" value="${esc(val)}" maxlength="${max}" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){ren=null;render()}" onblur="doRename(this.value)">`;
function toggleTask(id) {
  const t = task(id); t.d = t.d ? 0 : now();
  if (t.d) releaseIfIn(x => x === id);
  saveT(); render();
}
async function delTask(id) {
  const t = task(id); if (!(await ask('Удалить задачу «' + t.n + '» и всё её время?'))) return;
  releaseIfIn(x => x === id);
  const months = new Set(E.filter(e => e.t === id).map(e => ymOf(e.a)));
  E = E.filter(e => e.t !== id); T = T.filter(x => x.id !== id);
  saveT(); months.forEach(saveM); render();
}
function setPrice(pid, v) { const p = proj(pid), x = num(v); if (x >= 0) { p.pr = x; saveP(); } render(); }
function addPay(pid) {
  const p = proj(pid), a = num($('#pay-a').value), note = $('#pay-n').value.trim().slice(0, 60);
  if (!a) return toast('Впиши сумму доплаты');
  p.pr += a; p.h.push([now(), a, note]); saveP(); render();
}
function delPay(pid, i) { const p = proj(pid); p.pr -= p.h[i][1]; p.h.splice(i, 1); saveP(); render(); }
function closeProject(pid) {
  const p = proj(pid);
  releaseIfIn(x => (task(x) || {}).p === pid);
  p.c = now(); saveP(); render();
  toast(`Проект «${p.n}» закрыт.\n${fh(projSec(pid))} за ${money(p.pr)} → ${money(rate(p))}/ч`);
}

async function restore() {

/* ===== Периоды и отчёт ===== */
function range() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  let a, b;
  if (sMode === 'week') { d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 7 * sOff); a = new Date(d); b = new Date(d); b.setDate(b.getDate() + 7); }
  else { a = new Date(d.getFullYear(), d.getMonth() + sOff, 1); b = new Date(d.getFullYear(), d.getMonth() + sOff + 1, 1); }
  const last = new Date(b); last.setDate(last.getDate() - 1);
  const label = sMode === 'week'
    ? a.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ' – ' + last.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
    : a.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(' г.', '');
  return { a: a.getTime() / 1000, b: b.getTime() / 1000, last: last.getTime() / 1000, label };
}
function periodData() {
  const r = range(), es = allE().filter(e => e.a >= r.a && e.a < r.b), by = {};
  for (const e of es) {
    const pid = pidOf(e); if (!pid || !proj(pid)) continue;
    const x = by[pid] = by[pid] || { sec: 0, tasks: {} };
    x.sec += e.b - e.a; x.tasks[e.t] = (x.tasks[e.t] || 0) + e.b - e.a;
  }
  const rows = Object.keys(by).map(pid => { const p = proj(pid), rt = rate(p); return { p, sec: by[pid].sec, tasks: by[pid].tasks, rt, earned: rt * by[pid].sec / 3600 }; }).sort((x, y) => y.sec - x.sec);
  const sec = rows.reduce((x, y) => x + y.sec, 0), earned = rows.reduce((x, y) => x + y.earned, 0);
  const ws = allW().filter(w => w.a >= r.a && w.a < r.b).sort((x, y) => x.a - y.a);
  const studio = sum(ws), wids = new Set(ws.map(w => w.id)), inShift = sum(es.filter(e => wids.has(e.w)));
  return { r, es, rows, sec, earned, avg: sec > 0 ? earned / (sec / 3600) : 0, ws, studio, inShift,
    closed: P.filter(p => p.c >= r.a && p.c < r.b), byRate: rows.filter(x => x.rt > 0).slice().sort((x, y) => y.rt - x.rt) };
}
function shiftInfo(w) {
  const es = shiftEs(w.id), work = sum(es), byT = {};
  es.forEach(e => byT[e.t] = (byT[e.t] || 0) + e.b - e.a);
  const tasks = Object.entries(byT).sort((x, y) => y[1] - x[1]).map(([t, s]) => { const tk = task(t); return { t, s, done: !!(tk && tk.d && tk.d >= w.a && tk.d <= w.b + 5) }; });
  return { dur: w.b - w.a, work, tasks };
}
function reportText() {

  t += `Валюта: рубли. Рабочая сессия = время на студии от старта до завершения. Работа над задачами = время, когда шёл таймер конкретной задачи. Ставка проекта = полная стоимость ÷ все часы работы над задачами проекта. «Заработано за период» = часы по задачам за период × ставка проекта. У незакрытых проектов ставка предварительная.\n\n`;
  t += `ИТОГО ЗА ПЕРИОД\n`;

  t += `Заработано: ${money(D.earned)}\nСредняя ставка за час работы над задачами: ${money(D.avg)}/ч\n`;
  if (D.studio) t += `Заработано в пересчёте на час на студии: ${money(D.earned / (D.studio / 3600))}/ч\n`;
  t += `Закрыто проектов: ${D.closed.length}${D.closed.length ? ' на сумму ' + money(D.closed.reduce((x, p) => x + p.pr, 0)) + ' (' + D.closed.map(p => p.n).join(', ') + ')' : ''}\n`;
  if (D.rows.length) {
    t += `\nПРОЕКТЫ\n`;
    D.rows.forEach((x, i) => {
      const p = x.p;
      t += `\n${i + 1}. ${p.n} [${p.c ? 'закрыт ' + fdate(p.c) : 'в работе'}]\n   Стоимость: ${money(p.pr)}`;
      if (p.h.length) t += ` (изначально ${money(base(p))}; ` + p.h.map(h => `${h[1] > 0 ? '+' : ''}${money(h[1])} ${fdate(h[0])}${h[2] ? ' «' + h[2] + '»' : ''}`).join('; ') + ')';
      t += `\n   Часов по проекту всего: ${hd(projSec(p.id))}; из них за период: ${hd(x.sec)}\n`;

    D.ws.forEach(w => {

      t += `\n${fday(w.a)}, ${ftime(w.a)}–${w.open ? 'идёт сейчас' : ftime(w.b)}: на студии ${hd(s.dur)} ч, работа над задачами ${hd(s.work)} ч (${pct(s.work, s.dur)}%)\n`;
      s.tasks.forEach(x => t += `   - ${pname(x.t)} / ${tname(x.t)}: ${fh(x.s)}${x.done ? ' — завершена в этой сессии' : ''}\n`);

}

  const t0 = dayStart(now()), tw = W.filter(w => w.a >= t0), ted = sum(allE().filter(e => e.a >= t0)), tst = sum(tw);
  if (tw.length) {
    h += `<div class="grid" style="margin-top:24px">${kpi('Сегодня на студии', hd(tst) + ' ч', 'сессий: ' + tw.length)}${kpi('В задачах', hd(ted) + ' ч', pct(ted, tst) + '% времени')}</div>`;
    h += tw.filter(w => w.id !== ended).slice().reverse().map(w => shiftCard(w, true)).join('');
  }
  return h;
}

function viewProjects() {
  let h = '<h2>Проекты</h2>';
  const list = P.slice().sort((x, y) => (!!x.c - !!y.c) || (x.c ? y.c - x.c : y.cr - x.cr));
  if (!list.length) h += '<div class="hint">Пока нет проектов</div>';
  for (const p of list) {
    const s = projSec(p.id), done = T.filter(t => t.p === p.id && t.d).length, all = T.filter(t => t.p === p.id).length;
    h += `<button class="card pcard" onclick="cur='${p.id}';render()">
      <div class="row"><span>${dot(colorOf(p.id))}<b>${esc(p.n)}</b></span>${p.c ? '<span class="badge done">закрыт</span>' : '<span class="badge">в работе</span>'}</div>
      <div class="row" style="margin-top:10px"><span class="num">${money(p.pr)}</span><span class="num" style="color:${s ? 'var(--acc)' : 'var(--dim)'}">${s ? money(rate(p)) + '/ч' : '—'}</span></div>
      <div class="hbar"><i style="width:${all ? done / all * 100 : 0}%;background:${colorOf(p.id)}"></i></div>
      <div class="row hint num" style="margin-top:6px"><span>${fh(s)}</span><span>задачи ${done}/${all}</span></div></button>`;
  }
  h += `<details class="card" ${list.length ? '' : 'open'}><summary>Новый проект</summary><div style="margin-top:10px">${projectForm()}</div></details>`;
  return h + backupCard();
}
function viewProject(p) {
  const s = projSec(p.id), ts = T.filter(t => t.p === p.id).sort((a, b) => (!!a.d - !!b.d)), c = colorOf(p.id);
  const done = ts.filter(t => t.d).length;
  let h = `<a class="back" href="#" onclick="cur=null;ren=null;render();return false">‹ Проекты</a>` +
    (ren === 'p:' + p.id ? `<h2>${renInput(p.n, 80)}</h2>`
      : `<h2>${dot(c)}${esc(p.n)} <button class="pen" onclick="startRen('p:${p.id}')">✎</button></h2>`) +
    (p.c ? `<span class="badge done">закрыт ${fdate(p.c)}</span>` : '<span class="badge">в работе</span>') +
    `<div class="grid">${kpi('Время', hd(s) + ' ч', fh(s))}${kpi(p.c ? 'Итоговая ставка' : 'Ставка сейчас', s ? money(rate(p)) : '—', 'в час')}
      ${kpi('Стоимость', money(p.pr), p.h.length ? 'доплат: ' + p.h.length : '')}${kpi('Задачи', done + '/' + ts.length, ts.length ? pct(done, ts.length) + '% готово' : '')}</div>
    <div class="card"><div class="lbl">Стоимость, ₽</div>
      <input type="text" inputmode="decimal" value="${p.pr}" onchange="setPrice('${p.id}',this.value)" class="num">
      ${p.h.length ? `<div class="hint" style="margin-bottom:4px">Изначально ${money(base(p))}</div>` + p.h.map((x, i) => `<div class="line"><span><span class="num" style="color:${x[1] > 0 ? 'var(--acc)' : 'var(--red)'}">${x[1] > 0 ? '+' : ''}${money(x[1])}</span> <span class="hint">${fdate(x[0])}${x[2] ? ' · ' + esc(x[2]) : ''}</span></span><button class="x" onclick="delPay('${p.id}',${i})">✕</button></div>`).join('') : ''}
      <details><summary>Доплата</summary><div style="margin-top:8px">
        <input id="pay-a" type="text" inputmode="decimal" placeholder="Сумма, ₽ (минус — если вычли)">
        <input id="pay-n" placeholder="За что (необязательно)" maxlength="60">
        <button class="btn alt" onclick="addPay('${p.id}')">Добавить</button></div></details></div>
    <div class="card"><div class="lbl" style="margin-bottom:4px">Задачи</div>`;
  if (!ts.length) h += '<div class="hint" style="padding:8px 0">Пока нет задач</div>';
  for (const t of ts) {
    const es = E.filter(e => e.t === t.id).sort((a, b) => b.a - a.a), running = S && S.t === t.id, sec = taskSec(t.id);
    h += `<div class="task ${t.d ? 'd' : ''}"><div class="row">` +
      (ren === 't:' + t.id ? renInput(t.n, 100)
        : `<span><span class="tn">${esc(t.n)}</span><button class="pen" onclick="startRen('t:${t.id}')">✎</button></span><span style="white-space:nowrap">
      <span class="hint num">${fh(sec)}</span>
      ${!t.d && !p.c ? `<button class="ib play" onclick="go('${t.id}')">${running ? '●' : '▶'}</button>` : ''}
      ${!p.c ? `<button class="ib" onclick="toggleTask('${t.id}')">${t.d ? '↺' : '✓'}</button>` : ''}</span>`) +
      `</div><div class="hbar"><i style="width:${s ? sec / s * 100 : 0}%;background:${t.d ? 'var(--dim)' : c}"></i></div>
      <details><summary>Время по задаче</summary>
        ${es.map(e => `<div class="line"><span class="hint num">${fdate(e.a)} ${ftime(e.a)}–${ftime(e.b)}${e.w ? '' : ' · вручную'}</span><span class="num">${fh(e.b - e.a)} <button class="x" onclick="delEntry('${e.id}')">✕</button></span></div>`).join('') || '<div class="hint" style="padding:6px 0">Пусто</div>'}
        <div class="inl"><input id="md-${t.id}" type="date" value="${new Date().toLocaleDateString('sv')}"><input id="mm-${t.id}" type="text" inputmode="decimal" placeholder="мин" style="max-width:80px"><button class="btn sm alt" onclick="addManual('${t.id}')">+</button></div>
        <button class="btn del" onclick="delTask('${t.id}')">Удалить задачу</button></details></div>`;
  }
  if (!p.c) h += `<div class="inl" style="margin-top:8px"><input id="nt-${p.id}" placeholder="Новая подзадача" maxlength="100" onkeydown="if(event.key==='Enter')newTask('${p.id}')"><button class="btn sm" onclick="newTask('${p.id}')">+</button></div>`;
  h += '</div>';
  h += p.c ? `<button class="btn alt" onclick="reopenProject('${p.id}')">Вернуть проект в работу</button>`
           : `<button class="btn ok" onclick="closeProject('${p.id}')">Проект закрыт ✓ — посчитать ставку</button>`;
  h += `<button class="btn del" style="margin-top:10px" onclick="delProject('${p.id}')">Удалить проект</button>`;
  return h;
}
function dayCols(D) {
  const r = D.r, days = [];
  for (let d = new Date(r.a * 1000); d.getTime() / 1000 < r.b; d.setDate(d.getDate() + 1)) {
    const a = d.getTime() / 1000, n = new Date(d); n.setDate(n.getDate() + 1); const b = n.getTime() / 1000;
    days.push({ d: new Date(d), st: sum(D.ws.filter(w => w.a >= a && w.a < b)), wk: sum(D.es.filter(e => e.a >= a && e.a < b)) });
  }
  const mx = Math.max(3600, ...days.map(x => Math.max(x.st, x.wk)));
  const lab = x => sMode === 'week' ? x.d.toLocaleDateString('ru-RU', { weekday: 'short' }) : (x.d.getDate() === 1 || x.d.getDate() % 5 === 0 ? x.d.getDate() : '');
  return `<div class="card"><div class="row"><span class="lbl">Часы по дням</span><span class="hint num">макс ${hd(mx)} ч</span></div>
    <div class="cols">${days.map(x => `<div class="c"><b style="height:${x.st / mx * 100}%"></b><i style="height:${x.wk / mx * 100}%"></i></div>`).join('')}</div>
    <div class="axis">${days.map(x => `<span>${lab(x)}</span>`).join('')}</div>
    <div class="leg"><span><i style="background:var(--s2);outline:1px solid var(--dim)"></i>на студии</span><span><i style="background:var(--acc)"></i>в задачах</span></div></div>`;
}
function viewStats() {
  const D = periodData(), r = D.r;
  let h = `<div class="seg"><button class="${sMode === 'week' ? 'on' : ''}" onclick="sMode='week';sOff=0;report=null;render()">Неделя</button><button class="${sMode === 'month' ? 'on' : ''}" onclick="sMode='month';sOff=0;report=null;render()">Месяц</button></div>
    <div class="per"><button onclick="sOff--;report=null;render()">‹</button><b>${r.label}</b><button onclick="sOff++;report=null;render()">›</button></div>
    <div class="card"><div class="lbl">Заработано</div><div class="big" style="font-size:40px;margin-top:6px">${money(D.earned)}</div>
      ${D.closed.length ? `<div class="hint">закрыто проектов: ${D.closed.length} на ${money(D.closed.reduce((x, p) => x + p.pr, 0))}</div>` : ''}</div>
    <div class="grid">${kpi('В задачах', hd(D.sec) + ' ч', fh(D.sec))}${kpi('Ставка', money(D.avg), 'в час работы')}
      ${kpi('На студии', hd(D.studio) + ' ч', 'сессий: ' + D.ws.length)}${kpi('Полезно', pct(D.inShift, D.studio) + '%', D.studio ? money(D.earned / (D.studio / 3600)) + '/ч на студии' : 'нет сессий')}</div>`;
  h += dayCols(D);
  if (D.rows.length) {
    h += `<div class="card"><div class="lbl">Куда ушло время</div><div class="stack">${D.rows.map(x => `<i style="flex:${x.sec};background:${colorOf(x.p.id)}"></i>`).join('')}</div>` +
      D.rows.map(x => `<div class="line"><span>${dot(colorOf(x.p.id))}${esc(x.p.n)}</span><span class="num"><span class="hint">${pct(x.sec, D.sec)}% · </span>${hd(x.sec)} ч · ${money(x.earned)}</span></div>`).join('') + '</div>';
  }
  if (D.byRate.length) {
    const n = D.byRate.length, mx = D.byRate[0].rt;
    h += `<div class="card"><div class="lbl" style="margin-bottom:4px">Ставка по проектам</div>` + D.byRate.map((x, i) =>
      `<div style="padding:9px 0"><div class="row"><span>${esc(x.p.n)}${x.p.c ? '' : ' <span class="hint">предв.</span>'}${n > 1 && i === 0 ? ' <span class="badge done">дороже всего</span>' : n > 1 && i === n - 1 ? ' <span class="badge" style="color:var(--red)">дешевле всего</span>' : ''}</span><span class="num">${money(x.rt)}/ч</span></div>
       <div class="hbar"><i style="width:${x.rt / mx * 100}%;background:${colorOf(x.p.id)}"></i></div></div>`).join('') + '</div>';
  }
  h += `<button class="btn" style="margin-top:4px" onclick="makeReport()">Выгрузить отчёт за ${sMode === 'week' ? 'неделю' : 'месяц'}</button>`;
  if (report) h += `<textarea id="rep" readonly>${esc(report)}</textarea>`;
  if (D.ws.length) h += `<h2>Сессии</h2>` + D.ws.slice().reverse().map(w => shiftCard(w, true)).join('');
  if (!D.rows.length && !D.ws.length) h += '<div class="card hint center">За этот период работы не было</div>';
  h += `<div class="hint" style="margin-top:12px">Заработано = часы в задачах × ставка проекта. У незакрытых проектов ставка предварительная — снижается, пока добавляются часы.</div>`;
  return h;
}
setInterval(() => {
  if (!S) return;
  const dur = now() - S.w.a, work = sum(shiftEs(S.w.id)), el = $('#ringp');
  if (el) { const c = +el.dataset.c; el.setAttribute('stroke-dashoffset', c * (1 - Math.min(1, dur > 0 ? work / dur : 0))); el.setAttribute('stroke-opacity', work > 0 ? 1 : 0); }
  const p = $('#wpct'); if (p) p.textContent = pct(work, dur) + '%';
}, 1000);

function render() {
  ['home', 'proj', 'stat'].forEach(t => $('#n-' + t).classList.toggle('on', t === tab));
  const p = cur && proj(cur);
  $('#app').innerHTML = tab === 'home' ? viewHome() : tab === 'stat' ? viewStats() : p ? viewProject(p) : viewProjects();
  const key = tab + (p ? p.id : ''); if (key !== render.k) { $('#app').scrollTop = 0; render.k = key; }
  if (V('6.1')) { if (p) tg.BackButton.show(); else tg.BackButton.hide(); }
  const ri = $('#ren'); if (ri) { ri.focus(); ri.select(); }
}
if (V('6.1')) tg.BackButton.onClick(() => { cur = null; ren = null; render(); });

setInterval(() => {
  if (!S) return;
  const w = $('#wclock'); if (w) w.textContent = fd(now() - S.w.a);
  const k = $('#wwork'); if (k) k.textContent = fh(sum(shiftEs(S.w.id)));
  const t = $('#tclock'); if (t && S.t) t.textContent = fd(taskSec(S.t));
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !ren && !document.activeElement.matches('input,textarea')) render(); });

load().then(render).catch(e => { $('#app').innerHTML = '<div class="card">Не удалось загрузить данные: ' + esc((e && e.message) || e) + '</div>'; });
</script>
</body>
</html>
