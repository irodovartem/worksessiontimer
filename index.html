<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Рабочий таймер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a0c;--s1:#131316;--s2:#1c1c21;--line:rgba(255,255,255,.07);--tx:#f3f3f5;--mut:#8a8a94;--dim:#4d4d56;--acc:#c8f04a;--acc-tx:#0a0a0c;--red:#ff5d5d;--amb:#ffb648;--mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace}
html{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
body{margin:0;position:fixed;inset:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
:root{--top:0px;--bot:max(env(safe-area-inset-bottom),var(--tgb,0px))}
#app{position:absolute;top:var(--top);left:0;right:0;bottom:calc(64px + var(--bot));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px}
h2{margin:22px 0 10px;font-size:26px;font-weight:700;letter-spacing:-.02em}
h3{margin:0 0 10px;font-size:15px;font-weight:600}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.center{text-align:center}
.hint{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0}
.line+.line{border-top:1px solid var(--line)}
.line>span:last-child{white-space:nowrap}
select{width:100%;padding:12px 14px;border-radius:12px;border:0;background:var(--s2);color:var(--tx);font:inherit;margin:4px 0 8px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--s2);color:var(--tx);font:inherit;margin:4px 0 8px}
input:focus,textarea:focus{outline:none;border-color:rgba(200,240,74,.5)}
input::placeholder{color:var(--dim)}
textarea{font:12px/1.5 var(--mono);min-height:260px;color:var(--mut)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--acc);color:var(--acc-tx);font:inherit;font-weight:600;margin:4px 0}
.btn:active,.item:active,.go:active{transform:scale(.98)}
.btn.alt{background:var(--s2);color:var(--tx)}
.btn.ok{background:var(--acc);color:var(--acc-tx)}
.btn.warn{background:transparent;color:var(--amb);border:1px solid rgba(255,182,72,.4)}
.btn.del,.btn.end{background:transparent;color:var(--red);border:1px solid rgba(255,93,93,.3)}
.btn.sm{width:auto;padding:12px 16px;margin:4px 0 8px}
.two{display:flex;gap:8px}.two .btn{flex:1}
.inl{display:flex;gap:8px;align-items:center}
.inl input{flex:1;min-width:0}
.hero{min-height:100%;display:flex;flex-direction:column;padding-bottom:14px}
.hero-top{padding:18px 60px 0 2px}
.greet{font-size:clamp(24px,3.8vh,30px);font-weight:700;letter-spacing:-.02em;margin-top:6px}
.hero-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,4.5vh,48px) 0 clamp(18px,4.5vh,44px)}
.go{position:relative;display:grid;place-items:center;width:clamp(160px,28vh,220px);height:clamp(160px,28vh,220px);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#d9ff6e,var(--acc) 60%);color:var(--acc-tx);font:inherit;font-size:26px;font-weight:700;letter-spacing:-.01em;box-shadow:0 0 0 12px rgba(200,240,74,.06),0 28px 80px rgba(200,240,74,.2);transition:transform .15s}
.go::before,.go::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(200,240,74,.35);animation:ripple 3.6s ease-out infinite;pointer-events:none}
.go::after{animation-delay:1.8s}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.32);opacity:0}}
.go-cap{margin-top:clamp(24px,5vh,46px);text-align:center}
.trio{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border:1px solid var(--line);border-radius:20px}
.trio>div{padding:16px 6px 14px;text-align:center}
.trio>div+div{border-left:1px solid var(--line)}
.trio .v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:2px}
.link{display:block;margin:16px auto 0;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;padding:10px 14px}
@media (prefers-reduced-motion:reduce){.go::before,.go::after{animation:none}}
.clock{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.ringwrap{position:relative;width:256px;height:256px;margin:22px auto 8px}
.ringwrap svg{display:block}
.ringwrap .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:none}
.dot.live{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:var(--s2);color:var(--tx);font:inherit;padding:13px 14px;border-radius:14px;margin:6px 0}
.pcard{display:block;width:100%;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--s2);color:var(--mut);font-weight:500;vertical-align:middle}
.badge.done{background:rgba(200,240,74,.12);color:var(--acc)}
.big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.grid .card{margin:0}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin:16px 0 10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;padding:8px;border-radius:10px}
.seg button.on{background:var(--s2);color:var(--tx)}
.per{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.per b{font-weight:600;text-transform:capitalize}
.per button{border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;font-size:18px;width:42px;height:38px;border-radius:12px}
.task{padding:12px 0}
.task+.task{border-top:1px solid var(--line)}
.task.d .tn{text-decoration:line-through;color:var(--mut)}
.ib{border:0;background:var(--s2);color:var(--tx);font:inherit;border-radius:10px;padding:7px 11px;margin-left:4px}
.ib.play{background:var(--acc);color:var(--acc-tx)}
.pen{border:0;background:none;color:var(--dim);font-size:14px;padding:2px 6px}
details summary{color:var(--mut);font-size:13px;cursor:pointer;margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+ '}
details[open] summary::before{content:'− '}
details.sw{margin:4px 0 8px}
details.sw summary{text-align:center;padding:8px}
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px}
.ftabs::-webkit-scrollbar,.pager::-webkit-scrollbar{display:none}
.ftab{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mut);font:inherit;font-size:14px;padding:8px 14px;border-radius:20px;white-space:nowrap}
.ftab span{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:6px}
.ftab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ftab.on span{color:var(--bg);opacity:.55}
.pager{overflow:hidden;margin:0 -16px;touch-action:pan-y;transition:height .3s ease}
.track{display:flex;align-items:flex-start;transition:transform .34s cubic-bezier(.22,.8,.24,1);will-change:transform}
.page{flex:0 0 100%;min-width:0;padding:0 16px}
.gear{position:absolute;top:18px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s1);color:var(--mut);display:grid;place-items:center;padding:0;z-index:5}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear:active{transform:scale(.94)}
.tgl{position:relative;width:48px;height:28px;flex:none}
.tgl input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;z-index:1}
.tgl i{position:absolute;inset:0;background:var(--s2);border-radius:14px;transition:background .2s}
.tgl i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:left .2s,background .2s}
.tgl input:checked+i{background:var(--acc)}
.tgl input:checked+i::after{left:23px;background:var(--acc-tx)}
.errbar{position:fixed;left:12px;right:12px;top:calc(10px + var(--top) + env(safe-area-inset-top));z-index:50;background:#3a1416;color:#ffb3b3;border:1px solid rgba(255,93,93,.4);border-radius:14px;padding:12px 14px;font-size:13px}
.mback{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + var(--bot));opacity:0;transition:opacity .18s}
.mback.on{opacity:1}
.modal{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px 16px 12px;transform:translateY(20px);transition:transform .2s}
.mback.on .modal{transform:none}
.mmsg{white-space:pre-line;font-size:16px;line-height:1.45;margin:0 4px 16px}
.mbtns{display:flex;gap:8px}.mbtns .btn{flex:1;margin:0}
.btn.danger{background:var(--red);color:#fff}
.x{border:0;background:none;color:var(--dim);font-size:16px;padding:4px 8px}
a.back{color:var(--mut);text-decoration:none;display:inline-block;margin-top:16px;font-size:14px}
.top{color:var(--acc)}.low{color:var(--red)}
.hbar{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:8px}
.hbar i{display:block;height:100%;border-radius:3px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:12px 0 10px;background:var(--s2)}
.tl{position:relative;height:12px;background:var(--s2);border-radius:4px;overflow:hidden;margin:12px 0 6px}
.tl i{position:absolute;top:0;bottom:0}
.cols{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:14px}
.cols .c{flex:1;position:relative;height:100%}
.cols .c b,.cols .c i{position:absolute;bottom:0;left:0;right:0;border-radius:3px 3px 1px 1px}
.cols .c b{background:var(--s2)}
.cols .c i{background:var(--acc)}
.axis{display:flex;gap:3px;margin-top:6px}
.axis span{flex:1;text-align:center;font-size:10px;color:var(--dim);font-family:var(--mono);overflow:visible;white-space:nowrap}
.leg{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + var(--bot));align-items:flex-start;display:flex;background:rgba(10,10,12,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--bot));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.04em;padding:4px 0}
nav svg{display:block;margin:0 auto 4px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
</style>
</head>
<body>
<div id="app"><p class="hint" style="margin-top:30px">Загрузка…</p></div>
<nav>
  <button id="n-home" onclick="tab='home';cur=null;ren=null;settings=false;endAsk=false;resetAsk=false;render()"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg>Работа</button>
  <button id="n-proj" onclick="tab='proj';cur=null;ren=null;settings=false;endAsk=false;resetAsk=false;render()"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>Проекты</button>
  <button id="n-stat" onclick="tab='stat';cur=null;ren=null;settings=false;endAsk=false;resetAsk=false;render()"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>Статистика</button>
</nav>
<script>
// ▼▼▼ АДРЕС СЕРВЕРА ДЛЯ ОТПРАВКИ КОПИЙ В ЧАТ (Cloudflare Worker). Оставь пустым '', чтобы отключить. ▼▼▼
const BACKUP_URL = 'https://worksessiontimer.irodovartem.workers.dev/';
// ▲▲▲
const tg = window.Telegram && Telegram.WebApp;
const V = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
if (tg) { tg.ready(); tg.expand(); try { if (V('7.7')) tg.disableVerticalSwipes(); } catch {} }
const mobile = !!(tg && /^(ios|android|android_x)$/.test(tg.platform || ''));
const canFull = !!(mobile && V('8.0') && tg.requestFullscreen);
function applyInsets() {
  const sa = (tg && tg.safeAreaInset) || {}, ca = (tg && tg.contentSafeAreaInset) || {}, full = !!(tg && tg.isFullscreen);
  document.documentElement.style.setProperty('--top', (full ? (sa.top || 0) + (ca.top || 0) : 0) + 'px');
  document.documentElement.style.setProperty('--tgb', ((sa.bottom || 0) + (ca.bottom || 0)) + 'px');
}
if (tg && V('8.0')) { ['fullscreenChanged', 'safeAreaChanged', 'contentSafeAreaChanged', 'viewportChanged'].forEach(ev => { try { tg.onEvent(ev, applyInsets); } catch {} }); applyInsets(); }
function setFull(on) {
  if (!canFull) return;
  try { if (on && !tg.isFullscreen) tg.requestFullscreen(); if (!on && tg.isFullscreen) tg.exitFullscreen(); } catch {}
  setTimeout(applyInsets, 300);
}
// иконка на главном экране телефона
let homeSt = 'unsupported';
function checkHome() {
  if (!(tg && V('8.0') && tg.checkHomeScreenStatus)) return;
  try { tg.checkHomeScreenStatus(st => { homeSt = st || 'unknown'; if (settings) render(); }); } catch {}
}
if (tg && V('8.0')) try { tg.onEvent('homeScreenAdded', () => { homeSt = 'added'; render(); toast('Готово — иконка приложения на главном экране.'); }); } catch {}
function addHome() { try { tg.addToHomeScreen(); } catch (e) { toast('Не получилось: ' + ((e && e.message) || e)); } }
const cloud = !!(tg && tg.initData && tg.CloudStorage && V('6.9'));
const LS = 'st-';

/* ===== Хранилище: Telegram CloudStorage (синхронизируется между устройствами) или localStorage в обычном браузере ===== */
const store = {
  async keys() {
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.getKeys((e, k) => e ? no(e) : ok(k || [])));
    return Object.keys(localStorage).filter(k => k.startsWith(LS)).map(k => k.slice(LS.length));
  },
  async get(keys) {
    const out = {};
    for (let i = 0; i < keys.length; i += 40) {
      const part = keys.slice(i, i + 40);
      if (cloud) await new Promise((ok, no) => tg.CloudStorage.getItems(part, (e, v) => e ? no(e) : (Object.assign(out, v || {}), ok())));
      else part.forEach(k => { const v = localStorage.getItem(LS + k); if (v != null) out[k] = v; });
    }
    return out;
  },
  async set(k, v) {
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.setItem(k, v, e => e ? no(e) : ok()));
    localStorage.setItem(LS + k, v);
  },
  async del(keys) {
    if (!keys.length) return;
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.removeItems(keys, e => e ? no(e) : ok()));
    keys.forEach(k => localStorage.removeItem(LS + k));
  }
};

/* ===== Утилиты ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Math.floor(Date.now() / 1000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fd = s => { s = Math.max(0, s); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(n => String(n).padStart(2, '0')).join(':'); };
const fh = s => { const m = Math.round(s / 60); return Math.floor(m / 60) + ' ч ' + String(m % 60).padStart(2, '0') + ' м'; };
const hd = s => (s / 3600).toFixed(1).replace('.', ',');
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
const money = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fdate = t => new Date(t * 1000).toLocaleDateString('ru-RU');
const fday = t => new Date(t * 1000).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
const ftime = t => new Date(t * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const ymOf = t => { const d = new Date(t * 1000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const dayStart = t => { const d = new Date(t * 1000); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; };
// Свои окна сообщений и подтверждений — не зависят от системных окон Telegram/браузера
function modal(msg, btns) {
  return new Promise(res => {
    const back = document.createElement('div'); back.className = 'mback';
    back.innerHTML = `<div class="modal" role="dialog"><div class="mmsg"></div><div class="mbtns"></div></div>`;
    back.querySelector('.mmsg').textContent = msg;
    const box = back.querySelector('.mbtns');
    const close = v => { back.classList.remove('on'); setTimeout(() => back.remove(), 180); document.removeEventListener('keydown', key); res(v); };
    const key = e => { if (e.key === 'Escape') close(btns[0].v); if (e.key === 'Enter') close(btns[btns.length - 1].v); };
    btns.forEach(b => { const el = document.createElement('button'); el.className = 'btn ' + (b.cls || 'alt'); el.textContent = b.t; el.onclick = () => close(b.v); box.appendChild(el); });
    back.onclick = e => { if (e.target === back) close(btns[0].v); };
    document.addEventListener('keydown', key);
    document.body.appendChild(back); requestAnimationFrame(() => back.classList.add('on'));
  });
}
const toast = m => { modal(m, [{ t: 'OK', v: true, cls: '' }]); };
const ask = (m, ok = 'Да', danger = false) => modal(m, [{ t: 'Отмена', v: false }, { t: ok, v: true, cls: danger ? 'danger' : '' }]);
const buzz = () => { try { if (V('6.1')) tg.HapticFeedback.impactOccurred('medium'); } catch {} };
const parseHM = v => { const d = String(v).replace(/\D/g, ''); if (!d) return NaN; if (d.length <= 2) return +d; const m = +d.slice(-2); return m >= 60 ? NaN : +d.slice(0, -2) * 60 + m; }; // минуты
const hm = s => { const m = Math.round(s / 60); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
function fmtHM(el) { const d = el.value.replace(/\D/g, '').slice(0, 4); el.value = d.length > 2 ? d.slice(0, -2) + ':' + d.slice(-2) : d; }
const hmAttrs = 'type="text" inputmode="numeric" autocomplete="off" oninput="fmtHM(this)"';
const num = v => parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));

/* ===== Данные =====
   P — проекты {id, n, pr: стоимость, c: закрыт (время) или 0, cr: создан, h: [[время, сумма, комментарий]] доплаты}
   T — задачи {id, p: проект, n, d: готова (время) или 0}
   E — отрезки работы над задачей {id, t: задача, a, b, w: id рабочей сессии или null (если добавлено вручную)}
   W — завершённые рабочие сессии {id, a, b}
   S — текущая рабочая сессия {w: {id, a}, t: активная задача или null, r: начало текущего отрезка или null (пауза)} */
let P = [], T = [], E = [], W = [], F = [], S = null; // F — папки {id, n, cr}
const cache = {};
let tab = 'home', cur = null, ren = null, sMode = 'month', sOff = 0, report = null, ended = null;

async function load() {
  const keys = (await store.keys()).filter(k => /^(S$|B$|O$|P-|T-|e-|w-|F-)/.test(k));
  const v = await store.get(keys);
  for (const k of keys) {
    const s = v[k]; if (!s) continue;
    let d; try { d = JSON.parse(s); } catch { continue; }
    if (k === 'S') { S = d; continue; }
    if (k === 'B') { lastBk = +d || 0; continue; }
    if (k === 'O') { opt = Object.assign(opt, d); continue; }
    cache[k] = s;
    if (k.startsWith('P-')) d.forEach(r => P.push({ id: r[0], n: r[1], pr: r[2], c: r[3], cr: r[4], h: r[5] || [], f: r[6] || '' }));
    else if (k.startsWith('F-')) d.forEach(r => F.push({ id: r[0], n: r[1], cr: r[2] }));
    else if (k.startsWith('T-')) d.forEach(r => T.push({ id: r[0], p: r[1], n: r[2], d: r[3] }));
    else if (k.startsWith('w-')) d.forEach(r => W.push({ id: r[0], a: r[1], b: r[2], k: r[3] || [] }));
    else d.forEach(r => E.push({ id: r[0], t: r[1], a: r[2], b: r[3], w: r[4] || null }));
  }
  if (S && !S.w) S = { w: { id: uid(), a: S.a || now() }, t: S.t || null, r: S.r || null }; // старый формат
  if (S) { S.k = S.k || []; S.br = S.br || null; S.bt = S.bt || null; }
  P.sort((x, y) => x.cr - y.cr); F.sort((x, y) => x.cr - y.cr);
  T.sort((x, y) => x.id < y.id ? -1 : 1);
}

// Запись коллекции кусками до ~3500 символов (лимит Telegram — 4096 на ключ); неизменённые куски не перезаписываются
async function saveChunks(prefix, rows) {
  const chunks = []; let c = [];
  for (const r of rows) { c.push(r); if (JSON.stringify(c).length > 3500 && c.length > 1) { c.pop(); chunks.push(c); c = [r]; } }
  if (c.length) chunks.push(c);
  const want = new Set();
  for (let i = 0; i < chunks.length; i++) {
    const k = prefix + i, s = JSON.stringify(chunks[i]); want.add(k);
    if (cache[k] !== s) { await store.set(k, s); cache[k] = s; }
  }
  const stale = Object.keys(cache).filter(k => k.startsWith(prefix) && /^\d+$/.test(k.slice(prefix.length)) && !want.has(k));
  if (stale.length) { await store.del(stale); stale.forEach(k => delete cache[k]); }
}

  app.addEventListener('touchstart', e => {

    el = !settings && tab === 'stat' ? $('#swp') : null;

function range() {

  else { a = new Date(d.getFullYear(), d.getMonth() + sOff, 1); b = new Date(d.getFullYear(), d.getMonth() + sOff + 1, 1); }
  const last = new Date(b); last.setDate(last.getDate() - 1);
  const label = sMode === 'week'
    ? a.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ' – ' + last.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })

}

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#1c1c21" stroke-width="${sw}"/>
    <circle id="ringp" data-c="${c}" cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#c8f04a" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, p))}" stroke-opacity="${p > 0 ? 1 : 0}" transform="rotate(-90 ${m} ${m})" style="transition:stroke-dashoffset .8s"/></svg>`;
}

function showErr(m) {
  const d = document.createElement('div'); d.className = 'errbar'; d.textContent = 'Ошибка: ' + m;
  d.onclick = () => d.remove(); document.body.appendChild(d); setTimeout(() => d.remove(), 8000);
}
window.addEventListener('error', e => showErr(e.message || 'неизвестная'));
window.addEventListener('unhandledrejection', e => showErr((e.reason && e.reason.message) || String(e.reason)));
initSwipe();
load().then(async () => { if (opt.full !== false) setFull(true); try { if (mobile && V('8.0')) tg.lockOrientation(); } catch {} checkHome(); render(); await checkSub(); render(); autoBackup(); }).catch(e => { $('#app').innerHTML = '<div class="card">Не удалось загрузить данные: ' + esc((e && e.message) || e) + '</div>'; });
</script>
</body>
</html>
